name: Build and deploy marimo reports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Export notebooks to WebAssembly HTML
        shell: bash
        run: |
          mkdir -p _site
          notebooks=(
            C01_UniverseCandidateFNH.py
            C02_MatchRatesToInventorData.py
            C03_MatchedCandidateFNH.py
          )
          for notebook in "${notebooks[@]}"; do
            marimo export html-wasm "$notebook" \
              --output "_site/${notebook%.py}.html" \
              --mode run \
              --no-show-code \
              --force
          done
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
